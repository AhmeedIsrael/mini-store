<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Ecommerce Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to Our Ecommerce Store</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#product-list">Products</a></li>
            </ul>
        </nav>
        <span id="cart-count">Cart: 0 items</span>
    </header>
    <main>
        <h2>Our Products</h2>
        <p>Here are some of our amazing products! Go through our collection and find something you like!</p>
        <section id="product-list">
            <div class="product-card">
                <img src="https://placehold.co/300x200" alt="Wireless headphones">
                <h3>Wireless Headphones</h3>
                <p>$25.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://placehold.co/300x200" alt="Smartwatch">
                <h3>Smartwatch</h3>
                <p>$40.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://placehold.co/300x200" alt="Sneakers">
                <h3>Sneakers</h3>
                <p>$60.00</p>
                <button>Add to Cart</button>
            </div>
        </section>
        <section id="cart">
            <h2>Your Cart</h2>
            <div id="cart-items">
                
            </div>
            <p id="cart-total">Total: $0.00</p>
        </section>
    </main>
</body>
</html>
